[build]
target = "i686-pc-windows-gnu"

[unstable]
panic-abort-tests = true

[target.i686-pc-windows-gnu]
runner = "wine"

# Silence noise from the Wine runner used by `cargo test --target i686-pc-windows-gnu`.
[env]
WINEDEBUG = "-all"
WINEDLLOVERRIDES = "mscoree=,mshtml=,winemenubuilder.exe=d"
EGL_LOG_LEVEL = "fatal"
MESA_LOADER_DRIVER_OVERRIDE = "llvmpipe"
